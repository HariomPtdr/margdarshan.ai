version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  service-gateway:
    build:
      context: .
      dockerfile: service-gateway/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-chatbot:
        condition: service_started
      service-location:
        condition: service_started

  service-chatbot:
    build:
      context: .
      dockerfile: service-chatbot/Dockerfile
    ports: ["8001:8001"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  service-location:
    build:
      context: .
      dockerfile: service-location/Dockerfile
    ports: ["8002:8002"]
    env_file: .env

  service-nlu:
    build:
      context: .
      dockerfile: service-nlu/Dockerfile
    ports: ["8003:8003"]
    env_file: .env
    depends_on: [redis]

  service-classifier:
    build:
      context: .
      dockerfile: service-classifier/Dockerfile
    ports: ["8004:8004"]
    env_file: .env
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-model_v2}
    depends_on: [redis]
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./service-classifier/app:/app/app
      - ./service-classifier/model:/app/model:ro
      - ./service-classifier/model_v2:/app/model_v2:ro

  service-routing:
    build:
      context: .
      dockerfile: service-routing/Dockerfile
    ports: ["8005:8005"]
    env_file: .env
    depends_on: [redis]

  service-submission:
    build:
      context: .
      dockerfile: service-submission/Dockerfile
    ports: ["8006:8006"]
    env_file: .env
    depends_on: [redis]

  service-tracker:
    build:
      context: .
      dockerfile: service-tracker/Dockerfile
    ports: ["8007:8007"]
    env_file: .env
    depends_on: [redis]

  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    ports: ["5173:5173"]
    env_file: .env
    depends_on: [service-gateway]
    volumes:
      - ./web-frontend:/app
      - /app/node_modules

volumes:
  pgdata:
